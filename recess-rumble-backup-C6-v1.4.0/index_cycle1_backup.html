<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Recess Rumble</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#1b1712; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(20,14,8,.74); }
  #overlay.show { display:flex; }
  #card { background:#fff8e8; border:4px solid #2b1d10; border-radius:18px; padding:24px 28px; max-width:min(92vw,540px); text-align:center; box-shadow:0 14px 40px rgba(0,0,0,.5); }
  h1 { margin:0 0 6px; font-size:30px; letter-spacing:1px; color:#2b1d10; }
  p { margin:0 0 16px; color:#5b4632; font-size:14px; line-height:1.45; }
  #buttons { display:flex; flex-direction:column; gap:9px; }
  button { font:inherit; font-weight:700; font-size:15px; padding:12px 16px; border:3px solid #2b1d10; border-radius:12px; background:#ffd166; color:#2b1d10; cursor:pointer; white-space:pre-line; }
  button:hover { background:#ffe49a; }
  button.padsel { background:#ffd166; border-color:#2f9e44; box-shadow:0 0 0 4px rgba(47,158,68,.35); }
  .item-common { border-color:#888 !important; }
  .item-rare { border-color:#44aaff !important; }
  .item-epic { border-color:#aa44ff !important; }
  .item-legendary { border-color:#ffcc44 !important; }
  .slot-locked { opacity:.55; border-style:dashed; }
  .slot-weapon { border-color:#4dabf7 !important; }
  .slot-lock { font-size:12px; padding:6px 10px; }
  .slot-lock.locked { border-color:#ffd166; }
  /* Task 9 — Stitch-inspired shop / level-up layouts, implemented in the existing DOM overlay model */
  #card { position:relative; }
  #card.ui-shop { max-width:min(96vw,980px); width:980px; max-height:96vh; overflow-y:auto; background:linear-gradient(180deg,#5a3d22,#3a2716); border-color:#ffd166; padding:12px 18px; }
  #card.ui-shop h1 { color:#ffe9a8; text-align:left; font-size:20px; }
  #card.ui-shop p { color:#e9d7b6; margin-bottom:8px; font-size:12px; }
  #coin-badge { position:absolute; right:16px; top:12px; background:#ffd166; color:#2b1d10; border:3px solid #2b1d10; border-radius:999px; padding:3px 10px; font-weight:800; font-size:15px; box-shadow:0 3px 0 #2b1d10; }
  #card.ui-shop #buttons { width:100%; box-sizing:border-box; flex-direction:row; flex-wrap:wrap; gap:6px; justify-content:center; align-items:stretch; }
  .shop-slot { position:relative; order:1; flex:1 1 20%; min-width:90px; box-sizing:border-box; display:flex; flex-direction:column; gap:4px; padding:6px; border:4px solid #888; border-radius:10px; background:#fff8e8; box-shadow:0 4px 0 rgba(0,0,0,.35); }
  .shop-slot .slot-lock { position:absolute; top:-2px; right:-2px; font-size:10px; padding:2px 5px; border-width:2px; z-index:2; }
  .shop-slot button:not(.slot-lock) { min-height:76px; background:#fff3d6; border-width:3px; font-size:11px; line-height:1.25; text-align:left; padding:8px 5px; }
  #card.ui-shop .continue-btn { order:3; flex:0 0 45%; align-self:center; padding:8px 12px; }
  #card.ui-shop .reroll-btn { order:4; flex:0 0 45%; align-self:center; background:#ffb955; font-size:15px; padding:10px 14px; box-shadow:0 4px 0 #2b1d10; }
  #card.ui-shop .hint { color:#e9d7b6; }
  #card.ui-cards { max-width:min(96vw,720px); width:720px; background:linear-gradient(180deg,#fff8e8,#f4e4c1); }
  #card.ui-cards #buttons { flex-direction:row; gap:12px; justify-content:center; }
  #card.ui-cards #buttons button { width:200px; min-height:190px; box-sizing:border-box; background:#fff3d6; font-size:14px; line-height:1.35; border-width:3px; }
  #card.ui-cards #buttons button::before { content:'✦'; display:block; font-size:30px; margin-bottom:8px; color:#b5651d; }
  #card.ui-cards .card-marble::before { content:'⚪'; }
  #card.ui-cards .card-kite::before { content:'🪁'; }
  #card.ui-cards .card-gilli::before { content:'🏏'; }
  #card.ui-cards .card-compass::before { content:'🧭'; }
  #card.ui-cards button:hover { box-shadow:0 0 18px rgba(255,209,102,.85); transform:translateY(-2px); background:#ffe49a; }
  .hint { font-size:12px; color:#8a7458; margin-top:12px; }
  #stats-panel { position:fixed; right:12px; top:12px; width:214px; background:rgba(43,29,16,.88); color:#fff8e8;
    border:2px solid #ffd166; border-radius:12px; padding:10px 12px; font:12px/1.5 system-ui; z-index:15; display:none;
    box-shadow:0 6px 22px rgba(0,0,0,.4); }
  #stats-panel.show { display:block; }
  #stats-panel h3 { margin:0 0 6px; font-size:13px; color:#ffd166; letter-spacing:1px; }
  #stats-panel .row { display:flex; justify-content:space-between; gap:8px; }
  #stats-panel .sep { border-top:1px solid rgba(255,209,102,.35); margin:6px 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"><div id="card">
  <h1 id="title"></h1><p id="desc"></p><div id="buttons"></div><div class="hint" id="hint"></div>
</div></div>
<script>
// === RECESS RUMBLE: BROTATO DEPTH SPEC v1.1.1 ===
// Authored Cycle 1. Do not edit without bumping to v2.
// v1.1 task 8.5: compass standalone primary; tank kancha+gilli; aimer patang T2.
// [v1.1.1] aimer: starts with kancha T1 as secondary weapon; patang T2 remains identity weapon.
// Full six-section spec: DEPTH_SPEC.md (same folder). Sections:
// §1 Weapon Tier Merge  §2 Item Rarity + Unique Effects  §3 Shop Depth
// §4 Character Identity §5 Wave Scaling Curve           §6 Stat Cap / Exponent Rules
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');

// Procedural sprite compiler. Every sprite is drawn from code once into an offscreen
// canvas, then blitted per frame. No image files, no base64, no downloaded art.
// Style reference: Stitch "Schoolyard Arcade: Art Style Guide" (flat chibi, bold outlines).
const PROC = {};
const C = { ink:'#2b1d10', skin:'#f1c27d', skin2:'#d99a5b', hair:'#24160c', shirt:'#fbf9f2',
  shirtShade:'#dfe3ea', navy:'#1d4ed8', shorts:'#243b8a', shoe:'#3b2a1c', pack:'#e03131',
  packDark:'#a41f2c', gold:'#ffd166', ruby:'#b3123f', rubyLight:'#e0315a', purple:'#8d3fc4',
  purpleLight:'#b979e8', wood:'#a9702f', woodLight:'#d2a05c', mint:'#43b581', orange:'#f76707' };
function mk(name, w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round'; fn(g, w, h); PROC[name] = c;
}
function ell(g,x,y,rx,ry,f,s,lw){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,7); if(f){g.fillStyle=f;g.fill();} if(s){g.strokeStyle=s;g.lineWidth=lw||3;g.stroke();} }
function rr(g,x,y,w,h,r,f,s,lw){ g.beginPath(); g.roundRect(x,y,w,h,r); if(f){g.fillStyle=f;g.fill();} if(s){g.strokeStyle=s;g.lineWidth=lw||3;g.stroke();} }
function poly(g,p,f,s,lw){ g.beginPath(); g.moveTo(p[0][0],p[0][1]); for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]); g.closePath(); if(f){g.fillStyle=f;g.fill();} if(s){g.strokeStyle=s;g.lineWidth=lw||3;g.stroke();} }
function ln(g,x1,y1,x2,y2,s,lw){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.strokeStyle=s; g.lineWidth=lw||3; g.stroke(); }

mk('dust',96,96,(g)=>{
  const gr=g.createRadialGradient(48,48,4,48,48,42); gr.addColorStop(0,'#f8f9fa'); gr.addColorStop(1,'#adb5bd');
  ell(g,48,48,40,40,gr,C.ink,3);
  ell(g,34,42,5,6,'#fff',C.ink,1.5); ell(g,62,42,5,6,'#fff',C.ink,1.5);
  ell(g,35,43,2,3,C.ink); ell(g,61,43,2,3,C.ink);
  ln(g,26,30,42,35,C.ink,3); ln(g,70,30,54,35,C.ink,3);
  g.beginPath(); g.arc(48,60,7,3.2,6.1); g.strokeStyle=C.ink; g.lineWidth=2.5; g.stroke();
  ell(g,30,66,5,3,'rgba(255,255,255,.6)'); ell(g,66,66,5,3,'rgba(255,255,255,.6)');
});
mk('peon',128,128,(g)=>{
  rr(g,44,50,40,50,8,'#495057',C.ink,3);
  rr(g,44,50,10,48,5,'#343a40');
  ell(g,64,38,24,23,C.skin,C.ink,3);
  ell(g,64,24,25,15,C.hair,C.ink,3);
  ell(g,55,40,4,5,C.ink); ell(g,73,40,4,5,C.ink);
  rr(g,30,70,18,14,4,C.gold,C.ink,2);
});
mk('duster',128,128,(g)=>{
  const gr=g.createRadialGradient(60,60,5,64,64,52); gr.addColorStop(0,'#fff'); gr.addColorStop(1,'#ced4da');
  ell(g,64,64,50,44,gr,C.ink,3);
  rr(g,36,54,56,20,6,'#adb5bd',C.ink,2);
  ell(g,50,50,5,6,'#fff',C.ink,1.5); ell(g,78,50,5,6,'#fff',C.ink,1.5);
  ell(g,51,51,2,3,C.ink); ell(g,77,51,2,3,C.ink);
  for(let i=0;i<6;i++){ g.fillStyle='rgba(255,255,255,.7)'; g.beginPath(); g.arc(30+i*14,96+(i%2)*8,4,0,7); g.fill(); }
});
mk('captain',128,128,(g)=>{
  rr(g,40,48,48,54,8,C.navy,C.ink,3);
  poly(g,[[64,48],[80,60],[64,72],[48,60]],C.gold,C.ink,2);
  ell(g,64,34,25,24,C.skin,C.ink,3);
  rr(g,40,16,48,12,4,C.navy,C.ink,2);
  ell(g,55,36,4,5,C.ink); ell(g,73,36,4,5,C.ink);
  ln(g,48,26,60,30,C.ink,3); ln(g,80,26,68,30,C.ink,3);
  rr(g,84,72,10,30,3,C.wood,C.ink,2); poly(g,[[80,70],[98,70],[89,54]],'#ffd43b',C.ink,2);
});
mk('splitter',128,128,(g)=>{
  ell(g,50,64,30,30,'#e64980',C.ink,3);
  ell(g,78,64,30,30,'#f06595',C.ink,3);
  ell(g,42,58,5,6,'#fff',C.ink,1.5); ell(g,58,58,5,6,'#fff',C.ink,1.5);
  ell(g,70,58,5,6,'#fff',C.ink,1.5); ell(g,86,58,5,6,'#fff',C.ink,1.5);
  g.beginPath(); g.arc(50,80,7,3.2,6.1); g.strokeStyle=C.ink; g.lineWidth=2; g.stroke();
  g.beginPath(); g.arc(78,80,7,3.2,6.1); g.stroke();
});
mk('monitor',128,128,(g)=>{
  rr(g,42,50,44,52,8,'#f4f6fb',C.ink,3);
  rr(g,42,50,12,50,5,C.shirtShade);
  poly(g,[[52,52],[64,66],[76,52]],C.navy,C.ink,2);
  ell(g,64,38,26,25,C.skin,C.ink,3);
  ell(g,64,24,27,16,C.hair,C.ink,3);
  ell(g,55,40,4,5,C.ink); ell(g,73,40,4,5,C.ink);
  ln(g,47,30,59,34,C.ink,3); ln(g,81,30,69,34,C.ink,3);
  rr(g,80,70,30,8,3,C.wood,C.ink,2);
  ell(g,98,82,10,10,'#ffd43b',C.ink,2);
});
mk('sweeper',128,128,(g)=>{
  ell(g,64,64,52,52,'#f76707',C.ink,4);
  for(let i=0;i<6;i++){ const a=i*Math.PI/3; poly(g,[[64+Math.cos(a)*50,64+Math.sin(a)*50],[64+Math.cos(a+0.35)*28,64+Math.sin(a+0.35)*28],[64+Math.cos(a-0.35)*28,64+Math.sin(a-0.35)*28]],'#ffa94d',C.ink,2); }
  ell(g,50,58,8,10,'#fff',C.ink,2); ell(g,78,58,8,10,'#fff',C.ink,2);
  ell(g,52,60,3,4,C.ink); ell(g,76,60,3,4,C.ink);
  g.beginPath(); g.arc(64,84,12,3.2,6.1); g.strokeStyle=C.ink; g.lineWidth=3; g.stroke();
});
mk('marble',128,128,(g)=>{
  const gr=g.createRadialGradient(46,40,4,64,64,58);
  gr.addColorStop(0,'#ff7a9c'); gr.addColorStop(0.35,C.rubyLight); gr.addColorStop(0.75,C.ruby); gr.addColorStop(1,'#4d0718');
  ell(g,64,64,54,54,gr,C.ink,4);
  g.beginPath(); g.arc(64,64,38,0.2,5.6); g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=6; g.stroke();
  g.beginPath(); g.arc(64,64,22,2.4,5.9); g.strokeStyle='rgba(255,255,255,.28)'; g.lineWidth=4; g.stroke();
  ell(g,42,34,13,8,'rgba(255,255,255,.85)');
  ell(g,92,90,5,3,'rgba(255,255,255,.35)');
  ell(g,47,61,10,12,'#fff',C.ink,2); ell(g,81,61,10,12,'#fff',C.ink,2);
  ell(g,49,64,4,6,C.ink); ell(g,79,64,4,6,C.ink);
  ell(g,50,62,1.5,2,'#fff'); ell(g,80,62,1.5,2,'#fff');
  ln(g,34,45,55,52,C.ink,5); ln(g,94,45,73,52,C.ink,5);
  g.beginPath(); g.arc(64,86,11,3.2,6.1); g.strokeStyle=C.ink; g.lineWidth=3; g.stroke();
  ell(g,64,64,54,54,null,'rgba(43,29,16,.5)',2);
});
mk('kite',128,150,(g)=>{
  const gr=g.createLinearGradient(20,10,108,130); gr.addColorStop(0,C.purpleLight); gr.addColorStop(1,C.purple);
  ln(g,64,8,42,70,C.wood,3); ln(g,64,8,86,70,C.wood,3);
  poly(g,[[64,6],[114,66],[64,130],[14,66]],gr,C.ink,4);
  poly(g,[[64,6],[114,66],[64,66]],'rgba(255,255,255,.22)');
  poly(g,[[64,6],[14,66],[64,66]],'rgba(0,0,0,.12)');
  g.beginPath(); g.moveTo(30,66); g.lineTo(98,66); g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=2; g.stroke();
  ell(g,48,62,8,10,'#fff',C.ink,2); ell(g,80,62,8,10,'#fff',C.ink,2);
  ell(g,50,65,3.5,5,C.ink); ell(g,78,65,3.5,5,C.ink);
  ln(g,40,48,56,55,C.ink,4); ln(g,88,48,72,55,C.ink,4);
  g.beginPath(); g.arc(64,94,10,3.1,6.2); g.strokeStyle=C.ink; g.lineWidth=3; g.stroke();
  g.beginPath(); g.moveTo(64,130); g.bezierCurveTo(86,142,44,148,78,150); g.strokeStyle=C.gold; g.lineWidth=4; g.stroke();
  poly(g,[[66,134],[78,130],[74,142]],'#ff6b6b',C.ink,1.5);
  poly(g,[[52,142],[64,138],[60,150]],'#43b581',C.ink,1.5);
});
mk('gilli',128,128,(g)=>{
  for (let i=0;i<4;i++){ g.beginPath(); g.ellipse(52,84,46-i*9,13-i*2.5,0,0,7); g.strokeStyle='rgba(90,120,150,'+(0.4-i*0.09)+')'; g.lineWidth=3; g.stroke(); }
  const gr=g.createLinearGradient(36,28,66,98); gr.addColorStop(0,C.woodLight); gr.addColorStop(1,C.wood);
  poly(g,[[42,28],[68,34],[58,100],[34,90]],gr,C.ink,3);
  poly(g,[[42,28],[68,34],[52,42]],'rgba(255,255,255,.35)');
  ln(g,40,60,62,66,'rgba(80,45,15,.6)',3);
  rr(g,72,32,11,58,5,C.wood,C.ink,3);
  rr(g,72,46,11,6,2,'#e03131',C.ink,1);
  ln(g,86,24,112,50,C.ink,8); ln(g,86,24,112,50,C.woodLight,5);
  ell(g,110,48,7,7,C.gold,C.ink,2);
});
mk('top-boss',160,160,(g)=>{
  ell(g,80,138,52,10,'rgba(0,0,0,.18)');
  poly(g,[[80,18],[134,104],[26,104]],C.ruby,C.ink,4);
  for (let i=0;i<5;i++) poly(g,[[30+i*22,96],[48+i*22,96],[44+i*22,108],[26+i*22,108]],['#ffd166','#43b581','#1d4ed8','#f76707','#e0315a'][i]);
  rr(g,22,100,116,16,6,C.gold,C.ink,3);
  poly(g,[[56,116],[104,116],[80,148]],C.wood,C.ink,3);
  ell(g,62,74,8,10,'#fff',C.ink,2); ell(g,98,74,8,10,'#fff',C.ink,2);
  ell(g,64,76,4,5,C.ink); ell(g,96,76,4,5,C.ink);
  ln(g,52,60,70,66,C.ink,4); ln(g,108,60,90,66,C.ink,4);
  g.beginPath(); g.arc(80,94,12,3.3,6.0); g.strokeStyle=C.ink; g.lineWidth=3; g.stroke();
  ln(g,80,18,80,4,C.wood,8);
});

mk('prefect-boss',128,160,(g)=>{
  rr(g,38,70,52,70,8,'#f4f6fb',C.ink,3);
  rr(g,38,70,12,68,5,C.shirtShade);
  rr(g,44,132,16,22,4,C.navy,C.ink,2); rr(g,68,132,16,22,4,C.navy,C.ink,2);
  rr(g,40,150,22,8,3,C.shoe,C.ink,2); rr(g,66,150,22,8,3,C.shoe,C.ink,2);
  rr(g,30,78,10,34,5,C.skin,C.ink,2); rr(g,88,78,10,34,5,C.skin,C.ink,2);

  ell(g,64,44,28,27,C.skin,C.ink,3);
  ell(g,64,30,29,18,C.hair,C.ink,3);
  ell(g,54,46,4,5,C.ink); ell(g,74,46,4,5,C.ink);

  g.beginPath(); g.arc(64,52,8,3.4,6.0); g.strokeStyle='#a4503a'; g.lineWidth=2; g.stroke();
  rr(g,40,96,30,34,4,C.wood,C.ink,3); ln(g,44,104,66,104,C.woodLight,3);

});

mk('bell-boss',160,160,(g)=>{
  rr(g,18,30,26,110,4,'#a65a2e',C.ink,3); rr(g,116,30,26,110,4,'#a65a2e',C.ink,3);
  for(let y=40;y<136;y+=18){ ln(g,20,y,42,y,C.ink,2); ln(g,118,y,140,y,C.ink,2); }

  ell(g,63,94,3,4,C.ink); ell(g,97,94,3,4,C.ink);
  ln(g,54,80,70,86,C.ink,3); ln(g,106,80,90,86,C.ink,3);
  g.beginPath(); g.arc(80,108,9,3.3,6.0); g.strokeStyle=C.ink; g.lineWidth=2.5; g.stroke();
  for (let i=0;i<3;i++){ g.beginPath(); g.arc(80,80,56+i*12,-1.1,1.1); g.strokeStyle='rgba(255,215,0,.35)'; g.lineWidth=3; g.stroke(); }
});

function generateCover(w, h) {
  w = w || 512; h = h || 512;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#f0d9a8'); bg.addColorStop(1,'#c98d57');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=3;
  g.beginPath(); g.arc(w/2,h*0.58,Math.min(w,h)*0.34,0,7); g.stroke();
  g.fillStyle='#e03131'; g.font=`900 ${Math.round(w*0.13)}px system-ui`; g.textAlign='center';
  g.fillText('RECESS',w/2,h*0.22);
  g.fillStyle='#1d4ed8'; g.fillText('RUMBLE',w/2,h*0.34);
  g.fillStyle='#2b1d10'; g.font=`700 ${Math.round(w*0.035)}px system-ui`;
  g.fillText('CHAI · KANCHA · CRICKET BALLS',w/2,h*0.86);
  // simple mascot
  g.fillStyle='#fbf9f2'; g.fillRect(w/2-38,h*0.52,76,62);
  g.fillStyle='#243b8a'; g.fillRect(w/2-36,h*0.63,72,24);
  g.fillStyle='#f1c27d'; g.beginPath(); g.arc(w/2,h*0.49,34,0,7); g.fill();
  g.fillStyle='#24160c'; g.beginPath(); g.arc(w/2,h*0.47,35,Math.PI,0); g.fill();

// Lightweight skeletal rig: spine sway + walk cycle + weapon recoil.
// Drawn from code each frame, so the kid articulates instead of being a flat blit.
// Piskel-style block sprite: an integer pixel grid drawn from code, no image assets.
const PX = 2;
const PXO = { x:0, y:0 };
function pxR(gx, gy, w, h, col) {
  ctx.fillStyle = col; ctx.fillRect(PXO.x + gx*PX, PXO.y + gy*PX, w*PX, h*PX);

function drawPixelKid(x, y, dir, walk, recoil, vx, vy) {
  const back = dir.startsWith('n'), side = dir==='e' || dir==='w';

  ctx.translate(x, y + bob*PX);

  if (dir.includes('w')) ctx.scale(-1,1);

  ctx.rotate(lean);

  const armSwing = Math.sin(walk-0.35) > 0 ? 1 : 0;
  const pull = recoil > 0 && (1 - recoil/0.2) < 0.3 ? 1 : 0;
  if (!back) {
    pxR(2,9,4,5,C.pack); pxR(10,9,3,5,C.packDark); pxR(10,11,1,2,C.gold);
  }
  pxR(5+legL,18,2,2,C.skin2); pxR(9+legR,18,2,2,C.skin2);
  pxR(4+legL,20,4,1,C.shirt); pxR(9+legR,20,4,1,C.shirt);
  pxR(4+legL,21,4,1,C.shoe); pxR(9+legR,21,4,1,C.shoe);
  pxR(4,15,9,3,C.shorts); pxR(7,15,2,3,C.ink);
  pxR(3,9,10,6,C.shirt); pxR(3,9,1,6,C.shirtShade);
  pxR(4,9,2,2,C.navy); pxR(10,9,2,2,C.navy);
  if (!back) {
    pxR(7,10,2,1,C.navy); pxR(7,11,2,2,C.navy); pxR(7,13,2,1,C.navy);
    pxR(4,13,2,2,C.shirtShade); pxR(10,13,2,2,C.shirtShade);
  }
  pxR(1+armSwing,10,2,3,C.shirt); pxR(1+armSwing,13,2,2,C.skin);
  pxR(13-pull,10,2,3,C.shirt); pxR(13-pull,13,2,2,C.skin);
  const wt = player.weapons[0] ? player.weapons[0].type : 'kancha';
  if (wt==='gilli') {
    pxR(13-pull,15,1,4,C.wood); pxR(13-pull,15,1,1,C.navy); pxR(13-pull,18,1,1,C.gold);
  } else if (wt==='patang') {
    pxR(13-pull,15,1,2,C.gold); pxR(13-pull,17,2,2,C.purple); pxR(13-pull,17,1,1,C.purpleLight);
  } else {
    pxR(13-pull,15,1,3,C.shirt); pxR(13-pull,16,1,1,C.navy); pxR(13-pull,18,1,1,C.gold);
  }
  if (pull) { pxR(14-pull,15,1,1,C.gold); pxR(14-pull,17,1,1,'#fff8e1'); }
  if (back) {
    pxR(3,1,10,6,C.hair); pxR(4,2,8,7,C.hair);
    pxR(4,3,2,3,C.hair); pxR(10,3,2,3,C.hair);
  } else if (side) {
    pxR(4,1,7,6,C.hair); pxR(7,4,5,5,C.skin);
    if ((clock % 3.6) < 0.12) pxR(9,6,2,1,C.ink); else pxR(9,6,1,1,C.ink);
    pxR(12,7,1,1,C.skin);
  } else {
    pxR(4,3,8,6,C.skin);
    pxR(3,1,10,3,C.hair); pxR(4,2,8,2,C.hair);
    pxR(3,3,2,3,C.hair); pxR(11,3,2,3,C.hair);
    if ((clock % 3.6) < 0.12) { pxR(6,6,2,1,C.ink); pxR(9,6,2,1,C.ink); }
    else if (dir==='se') pxR(9,6,2,1,C.ink);
    else { pxR(6,6,1,1,C.ink); pxR(9,6,1,1,C.ink); }
    pxR(7,8,3,1,'#a4503a');
  }
  // visible gear: every picked item/stat changes the silhouette
  const items=(player.items||[]).map(i=>i.id);
  if (items.includes('tiffin')) pxR(11,14,3,3,'#e9c46a');
  if (items.includes('bus')) pxR(3,10,2,3,'#4ea8de');
  if (items.includes('chai')) pxR(12,9,2,3,'#b5651d');
  if (items.includes('ball')) pxR(2,16,2,2,'#e03131');
  if (items.includes('umbrella')) { pxR(5,-9,8,1,'#7048e8'); pxR(8,-11,1,2,C.ink); }
  if (items.includes('notes')) pxR(3,12,3,3,'#2f9e44');
  if (items.includes('water')) pxR(13,13,2,4,'#22b8cf');
  if (player.armor>0) { pxR(-3,10,3,3,'#adb5bd'); pxR(15,10,3,3,'#adb5bd'); }
  if (player.dodge>0) pxR(5,12,6,2,'#63e6be');
  if (player.lifesteal>0) pxR(1,15,2,2,'#f8f9fa');
  if (player.critDmg>2) { pxR(5,6,3,1,'#ffd43b'); pxR(9,6,3,1,'#ffd43b'); }
  if (player.compass) pxR(7,12,2,2,'#66d9e8');
  if (player.evos.includes('masala')) { ctx.strokeStyle='rgba(255,145,43,.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(8,9,PX*15,0,7); ctx.stroke(); }
  if (player.evos.includes('rang')) { pxR(0,2,1,1,'#ff6b6b'); pxR(15,2,1,1,'#ffd166'); pxR(0,18,1,1,'#43b581'); pxR(15,18,1,1,'#4dabf7'); }
  for (const w of (player.weapons||[])) {
    const t=weaponTier(w);
    if (t<=1) continue;
    if (w.type==='kancha') for (let k=1;k<t;k++) pxR(4+k*2,20,2,2,'#ffd166');
    else if (w.type==='patang') for (let k=1;k<t;k++) pxR(-2+k*2,8,2,2,'#b5179e');
    else if (w.type==='gilli') for (let k=1;k<t;k++) pxR(15,12+k*3,2,2,'#a9702f');
    else if (w.type==='compass') pxR(7,20,2,2,'#66d9e8');
  }
  ctx.restore();
}

  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  padAxis.x = Math.abs(ax) > 0.18 ? ax : 0;
  padAxis.y = Math.abs(ay) > 0.18 ? ay : 0;
  const down = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const edge = i => down(i) && !padPrev[i];
  if (edge(9)) togglePause();

  if (phase === 'levelup' || phase === 'upgrade') {
    const cards = [...buttonsEl.querySelectorAll('button')];
    if (edge(12) || edge(14)) padSel = (padSel - 1 + cards.length) % (cards.length || 1);
    if (edge(13) || edge(15)) padSel = (padSel + 1) % (cards.length || 1);
    if (edge(0) && cards[padSel]) cards[padSel].click();

  for (let i=particles.length-1;i>=0;i--) { const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if (p.life<=0) { recycle('particle',p); particles.splice(i,1); } }

    if (hasItem('tiffin_box')) player.hp=Math.min(player.maxHp, player.hp+player.maxHp*0.15);
    if (wave<5) showPendingLevels();
    else { audioEngine.stopMusic(); if (dailyMode) unlockAchievement('daily_complete'); recordRun(score, seedNum); save.wins++; unlock('champion'); unlockAchievement('victory'); persist(); phase='win'; showOverlay('BELL RANG. YOU WIN.','Five waves, '+score+' stopped, level '+level+'.',[{label:'PLAY AGAIN',action:newGame}],'Daily seed '+seedNum+' · same schoolyard for everyone today.'); }

}

function levelUp() {
  xp-=xpNext; level++; xpNext=4+level*3; audioEngine.sfx('levelup');
  if (level>=5) { unlock('raincoat'); persist(); }
  if (level>=10) unlockAchievement('level_10');
  pendingLevels=Math.min(8,pendingLevels+1);
  bannerText='LEVEL '+level+'!'; banner=1.1;
}
function rerollCost() { return Math.floor((5+wave)*Math.pow(1.5,rerollCount)); }
function shopOfferPool() {
  const pool=[];
  ITEMS.filter(i=>!player.items.some(x=>x.id===i.id)).forEach(i =>
    pool.push({ kind:'item', item:i, id:i.id, price:6+Math.floor(rnd()*5)+wave, locked:false }));
  ['kancha','patang','gilli','compass'].forEach(type => {
    const w=getWeapon(type);
    if (w && weaponTier(w)>=TIER_MAX[type]) return;
    pool.push({ kind:'weapon', type, id:type, price:10+wave*2, locked:false });
  });
  return pool;
}
function freshOffer(pool) { return pool.splice(Math.floor(rnd()*pool.length),1)[0] || null; }
function rollShop() {
  const pool=shopOfferPool();
  shopOffers=[];
  for (let i=0;i<4;i++) {
    if (carriedSlots[i]) { shopOffers.push(Object.assign({},carriedSlots[i],{locked:true})); continue; }
    shopOffers.push(freshOffer(pool));
  }
}
function shopWeaponTier(type) { const w=getWeapon(type); return w ? Math.min(weaponTier(w)+1,TIER_MAX[type]) : 1; }
function buyShopOffer(i) {
  const o=shopOffers[i]; if (!o || coins<o.price) { beep(160,0.08,0.02); return false; }
  coins-=o.price;
  if (carriedSlots[i] && carriedSlots[i].id===o.id) carriedSlots[i]=null;
  if (o.kind==='item') { o.item.apply(player); player.items.push(o.item); }
  else {
    const w=getWeapon(o.type);
    if (w) {
      if (weaponTier(w)>=TIER_MAX[o.type]) { beep(160,0.08,0.02); return false; }
      w.level=weaponTier(w)+1;
    } else addWeapon(o.type);
  }
  beep(880,0.08,0.03); shopOffers[i]=freshOffer(shopOfferPool()); return true;
}
function showPendingLevels() {
  if (pendingLevels<=0) { showShop(); return; }
  phase='levelup';
  showCards('LEVEL '+level, 'Wave clear — spend your level-up.', 'Levels left: '+pendingLevels, 'pending');
}
function toggleShopLock(i) {
  const o=shopOffers[i]; if (!o) return;
  o.locked=!o.locked;
  if (o.locked) carriedSlots[i]=Object.assign({},o,{locked:true});
  else carriedSlots[i]=null;
  showShop();
}
function rerollShop() {
  const cost=rerollCost(); if (coins<cost) return;
  coins-=cost; rerollCount++;
  const pool=shopOfferPool();
  for (let i=0;i<4;i++) if (shopOffers[i] && !shopOffers[i].locked) shopOffers[i]=freshOffer(pool);
  showShop();
}
function showShop() {
  rollShop();
  phase='upgrade';
  const btns=[{ label:'CONTINUE →', cls:'continue-btn', action:()=>{ carriedSlots=shopOffers.map(o=>o&&o.locked?Object.assign({},o,{locked:true}):null); rerollCount=0; wave++; startWave(); } }];
  shopOffers.forEach((o,i) => {
    if (!o) return;
    const slotCls=o.locked?'slot-locked':(o.kind==='item' ? 'item-'+o.item.rarity : 'slot-weapon');
    btns.push({
      cls:'slot-lock'+(o.locked?' locked':''), slot:i, slotCls,
      label:(o.locked?'🔒 UNLOCK':'🔓 LOCK')+' slot '+(i+1),
      action:()=>toggleShopLock(i)
    });
    btns.push({
      cls:slotCls, slot:i,
      disabled:o.locked,
      label:(o.kind==='weapon'
        ? (o.type==='compass'?'Compass Ray':'Upgrade '+o.type)+' → T'+shopWeaponTier(o.type)+' ('+o.price+' coins)'
        : o.item.name+' ('+o.price+' coins)\n'+o.item.desc)+(o.locked?' 🔒':''),
      action:()=>{ buyShopOffer(i); showShop(); }
    });
  });
  btns.push({ cls:'reroll-btn', label:'Reroll (🪙'+rerollCost()+')', disabled:coins<rerollCost(), action:rerollShop });
  showOverlay('SNACK SHOP','🪙 '+coins+' · buy a snack, then continue.',btns,'Locks carry to next wave · reroll '+rerollCost()+' coins.','shop','🪙 '+coins);
}
function showCards(title, desc, hint, kind) {
  const cardKind = kind || 'level';
  phase = phase==='levelup' ? 'levelup' : 'upgrade';
  const pool = CARDS.slice();
  // weighted offers: weapons already owned but not maxed are twice as likely
  const wmap={marble:['kancha',5],kite:['patang',3],gilli:['gilli',3]};
  for (const c of CARDS) { const w=wmap[c.id]; if (w) { const owned=getWeapon(w[0]); if (owned && owned.level<w[1]) pool.push(c); } }
  const forced = [];
  for (const evo of EVOS) {
    if (hasEvo(evo.id)) continue;
    const ready = Object.entries(evo.req).every(([t,l]) => { const w = getWeapon(t); return w && w.level >= l; });
    if (ready) forced.push({ id:'evo-'+evo.id, label:'EVOLVE: '+evo.name, desc:evo.desc, act:() => { player.evos.push(evo.id); beep(980,0.18,0.04); } });
  }
  if (level<=2 && player.weapons.length===1) {
    const wc = CARDS.filter(c => ['marble','kite','gilli'].includes(c.id));
    forced.push(wc[Math.floor(rnd()*wc.length)]);
  }
  const picks=[];
  if (forced.length) {
    const first = forced.splice(Math.floor(rnd()*forced.length),1)[0];
    picks.push(first);
    for (let i=pool.length-1;i>=0;i--) if (pool[i].id===first.id) pool.splice(i,1);
  }
  for (let i=picks.length;i<3 && pool.length;i++) picks.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
  const tierTag=id=>{ const m=wmap[id]; if(!m) return ''; const w=getWeapon(m[0]); return '\n→ T'+(w?Math.min(m[1],w.level+1):1)+'/'+m[1]; };
  showOverlay(title,desc,picks.map(c=>({ cls:'card-'+c.id, label:t(c.label)+tierTag(c.id)+'\n'+t(c.desc), action:()=>{
    c.act();
    if (phase==='levelup'||phase==='upgrade') {
      if (cardKind==='pending') { pendingLevels--; if (pendingLevels>0) showPendingLevels(); else showShop(); }
      else if (cardKind==='wave') { wave++; startWave(); }
      else { phase='playing'; hideOverlay(); }
    }
  } })),hint,'cards');
}

      ctx.fillStyle='rgba(255,255,255,.2)'; ctx.beginPath(); ctx.moveTo(-e.r,e.r*0.5); ctx.lineTo(0,-e.r); ctx.lineTo(0,e.r*0.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(0,e.r*0.3,e.r*0.35,0,7); ctx.fill();
      ctx.fillStyle='#2b1d10'; ctx.beginPath(); ctx.arc(0,e.r*0.3,e.r*0.12,0,7); ctx.fill();
    } else if (e.bossKind==='prefect') {
      ctx.fillStyle=e.color; ctx.fillRect(-e.r*0.7,-e.r,e.r*1.4,e.r*2);
      ctx.fillStyle='#1b2f1b'; ctx.fillRect(-e.r*0.7,-e.r*0.2,e.r*1.4,6);
      ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(-e.r*0.7,-e.r,e.r*0.35,e.r*2);
      ctx.fillStyle='#ffd43b'; ctx.beginPath(); ctx.arc(0,-e.r*0.55,e.r*0.28,0,7); ctx.fill();
      ctx.fillStyle='#ffd43b'; ctx.font='bold 22px system-ui'; ctx.textAlign='center'; ctx.fillText('P',0,e.r*0.75);
    } else {
      ctx.fillStyle=e.color; ctx.beginPath(); ctx.arc(0,0,e.r,Math.PI,0); ctx.lineTo(e.r*0.7,e.r*0.6); ctx.lineTo(-e.r*0.7,e.r*0.6); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(0,0,e.r*0.7,Math.PI,0); ctx.fill();
      ctx.fillStyle='#b3123f'; ctx.beginPath(); ctx.arc(0,e.r*0.6,7,0,7); ctx.fill();
    }
  } else {
    ctx.fillStyle=e.color; ctx.beginPath(); ctx.arc(0,0,e.r,0,7); ctx.fill();
    ctx.strokeStyle='#e8a09a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,e.r*0.55,0.4,4.2); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(-e.r*0.3,-e.r*0.35,e.r*0.22,0,7); ctx.fill();
  }
  if (e.flash>0) { ctx.globalAlpha=Math.min(0.85,e.flash/0.12); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,e.r+2,0,7); ctx.fill(); ctx.globalAlpha=1; }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if (shake>0) ctx.translate((Math.random()-0.5)*shake*22,(Math.random()-0.5)*shake*22);
  ctx.save(); ctx.translate(-camX,-camY);
  ctx.drawImage(GROUND, camX, camY, W, H, camX, camY, W, H);
  ctx.globalAlpha=0.05; ctx.fillStyle=groundTint(seedNum); ctx.fillRect(camX,camY,W,H); ctx.globalAlpha=1;
  for (let i=0;i<14;i++) {
    const lx=camX+((i*173+clock*22*(1+i%3))%W);
    const ly=camY+((i*97+clock*15+Math.sin(clock*1.3+i)*30)%H);
    ctx.save(); ctx.translate(lx,ly); ctx.rotate(clock*0.8+i);
    ctx.fillStyle=i%2?'#c46b27':'#9b8b3b'; ctx.beginPath(); ctx.ellipse(0,0,5,2,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(60,40,20,.5)'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(4,0); ctx.stroke(); ctx.restore();
  }
  if (player) for (const p of pickups) {
    const d=Math.hypot(player.x-p.x,player.y-p.y);
    if (d < player.magnet) { ctx.strokeStyle='rgba(255,209,102,.28)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(player.x,player.y); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  }
  for (const p of pickups) {
    ctx.save(); ctx.translate(p.x,p.y);
    if (p.kind === 'item') {
      ctx.fillStyle=p.item.color; ctx.fillRect(-9,-9,18,18);
      ctx.strokeStyle='#2b1d10'; ctx.lineWidth=2; ctx.strokeRect(-9,-9,18,18);
      ctx.fillStyle='#fff'; ctx.font='bold 13px system-ui'; ctx.textAlign='center'; ctx.fillText(p.item.label,0,5);
    } else { ctx.rotate(0.785); ctx.fillStyle='#ffe066'; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r); }
    ctx.restore();
  }
  for (const s of spawnMarkers) { ctx.strokeStyle='rgba(224,49,49,'+(s.life/0.45)+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(s.x,s.y,18*(1-s.life/0.45)+6,0,7); ctx.stroke(); }
  for (const e of enemies) drawFoe(e);
  for (const m of marbles) {
    ctx.strokeStyle=m.color; ctx.globalAlpha=0.3; ctx.lineWidth=m.r*1.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(m.x-m.vx*0.05,m.y-m.vy*0.05); ctx.lineTo(m.x,m.y); ctx.stroke(); ctx.globalAlpha=1;
    if (m.kind==='friend') {
      ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(Math.atan2(m.vy,m.vx));
      poly(ctx,[[6,0],[-4,3],[-2,0],[-4,-3]],'#63e6be','#2b8a3e',1.5);
      ctx.restore();
    } else {
      const mg=ctx.createRadialGradient(m.x-2,m.y-2,0,m.x,m.y,m.r+1);
      mg.addColorStop(0,'#ffffff'); mg.addColorStop(0.3,m.color); mg.addColorStop(1,'rgba(43,29,16,.85)');
      ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r*0.55,0.5,4.5); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(m.x-1.8,m.y-1.8,1.5,0,7); ctx.fill();
      if (m.dmg>1) { ctx.strokeStyle='rgba(255,145,43,.7)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(m.x,m.y,m.r+2,0,7); ctx.stroke(); }
    }
  }
  for (const b of bullets) {
    ctx.fillStyle='rgba(225,49,49,.18)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r+4,0,7); ctx.fill();
    ctx.fillStyle='#fff8e1'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    ctx.strokeStyle='#ff6b6b'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='rgba(43,29,16,.5)'; ctx.beginPath(); ctx.arc(b.x+1,b.y+1,1.2,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(b.x-b.vx*0.05,b.y-b.vy*0.05); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  if (!settings.reducedMotion) for (const a of afterimages) { ctx.globalAlpha=(a.life/0.28)*0.35; ctx.fillStyle='#1d4ed8'; ctx.fillRect(a.x-7,a.y-13,14,26); }
  ctx.globalAlpha=1;
  if (player) {
    ctx.fillStyle='rgba(40,25,10,.25)'; ctx.beginPath(); ctx.ellipse(player.x,player.y+16,15,5,0,0,7); ctx.fill();
    if (player.friendPos) for (const f of player.friendPos) { ctx.fillStyle='rgba(40,25,10,.2)'; ctx.beginPath(); ctx.ellipse(f.x,f.y+12,11,4,0,0,7); ctx.fill(); }
    if (invuln>0 && Math.floor(invuln*12)%2) ctx.globalAlpha=0.45;
    const gilli=getWeapon('gilli');
    if (player.meleeFx>0 && gilli) { ctx.strokeStyle='rgba(255,220,120,'+(player.meleeFx*4)+')'; ctx.lineWidth=12; ctx.beginPath(); ctx.arc(player.x,player.y,52+12*gilli.level,Math.atan2(player.faceY,player.faceX)-1,Math.atan2(player.faceY,player.faceX)+1); ctx.stroke(); }
    const bob = Math.sin(clock*8)*1.5;
    const ax=Math.abs(player.faceX), ay=Math.abs(player.faceY);
    let dir = '';
    if (ay > ax*0.414 && ay > 0.3) dir += player.faceY > 0 ? 's' : 'n';
    if (ax > ay*0.414 && ax > 0.3) dir += player.faceX > 0 ? 'e' : 'w';
    drawPixelKid(player.x, player.y, dir, player.walk, player.recoil, player.vx, player.vy);
    if (player.friendPos) for (const f of player.friendPos) {
      ctx.fillStyle='#2f9e44'; ctx.beginPath(); ctx.arc(f.x,f.y,10,0,7); ctx.fill();
      ctx.fillStyle='#f1c27d'; ctx.beginPath(); ctx.arc(f.x,f.y-7,5,0,7); ctx.fill();
    }
    if (player.shieldMax && player.shieldTimer > 0) { ctx.strokeStyle='rgba(112,72,232,.75)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(player.x,player.y,20,0,7); ctx.stroke(); }
    if (player.rangFx > 0) { ctx.strokeStyle='rgba(255,107,107,'+(player.rangFx/0.4)+')'; ctx.lineWidth=8; ctx.beginPath(); ctx.arc(player.x,player.y,20+95*(1-player.rangFx/0.4),0,7); ctx.stroke(); }
    const patang=getWeapon('patang');
    if (patang) {
      const cyc = hasEvo('cyclone'), radius = cyc?82:58, ks = cyc?11:9;
      for (let i=0;i<patang.level;i++) {
        const a=player.orbit+i*6.283/patang.level, kx=player.x+Math.cos(a)*radius, ky=player.y+Math.sin(a)*radius;
        ctx.strokeStyle=cyc?'rgba(229,153,247,.45)':'rgba(181,23,158,.4)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(kx-Math.cos(a)*18,ky-Math.sin(a)*18); ctx.lineTo(kx,ky); ctx.stroke();
        ctx.fillStyle=cyc?'#e599f7':'#b5179e'; ctx.beginPath(); ctx.moveTo(kx,ky-ks); ctx.lineTo(kx+ks,ky); ctx.lineTo(kx,ky+ks); ctx.lineTo(kx-ks,ky); ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }
  for (const p of particles) { ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2)); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill(); }
  for (const q of texts) {
    ctx.globalAlpha=Math.min(1,q.life*1.8); ctx.font='bold 14px system-ui'; ctx.textAlign='center';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(30,20,10,.8)'; ctx.strokeText(q.value,q.x,q.y);
    ctx.fillStyle=q.color; ctx.fillText(q.value,q.x,q.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  if (weather) { ctx.fillStyle='rgba(70,110,160,.16)'; ctx.fillRect(0,0,W,H); ctx.strokeStyle='rgba(200,225,255,.35)'; ctx.lineWidth=1; const rainN=(lowQ||settings.reducedMotion)?12:60; for (let i=0;i<rainN;i++) { const x=Math.random()*W, y=Math.random()*H; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-4,y+14); ctx.stroke(); } }
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(40,20,5,.28)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if (lowHealth()) { ctx.fillStyle='rgba(200,30,30,'+(0.07+0.05*Math.sin(clock*6))+')'; ctx.fillRect(0,0,W,H); }
  if (player.slowTimer>0) { ctx.fillStyle='rgba(220,230,240,.10)'; ctx.fillRect(0,0,W,H); }
  const hs=ctx.createLinearGradient(0,0,0,80); hs.addColorStop(0,'rgba(255,248,232,.72)'); hs.addColorStop(1,'rgba(255,248,232,0)');
  ctx.fillStyle=hs; ctx.fillRect(0,0,W,80);

  ctx.font='bold 18px system-ui'; ctx.textAlign='left'; ctx.fillStyle='#2b1d10'; ctx.fillText(t('WAVE')+' '+Math.min(wave,5)+'/5',18,28);
  ctx.textAlign='right'; ctx.fillText(t('SCORE')+' '+score,W-18,28);
  ctx.font='bold 12px system-ui'; ctx.textAlign='left'; ctx.fillText(t('LV')+' '+level,18,48);
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(18,62,52,5);
  ctx.fillStyle=player.dashCd<=0?'#4dabf7':'#74c0fc'; ctx.fillRect(18,62,52*(1-player.dashCd/2.5),5);
  ctx.fillStyle='#e9c46a'; ctx.font='bold 12px system-ui'; ctx.textAlign='left'; ctx.textAlign='right'; ctx.fillText('◉ '+coins,W-18,50);
  ctx.textAlign='center';
  for (let i=0;i<player.maxHp;i++) { ctx.beginPath(); ctx.arc(W/2-9*player.maxHp+9+i*18,22,6,0,7); ctx.fillStyle=i<player.hp?'#e03131':'rgba(0,0,0,.2)'; ctx.fill(); }
  const bw=Math.min(W*0.5,300);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect((W-bw)/2,36,bw,6);
  ctx.fillStyle='#2f9e44'; ctx.fillRect((W-bw)/2,36,bw*Math.max(0,waveTime)/20,6);
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect((W-bw)/2,47,bw,4);
  ctx.fillStyle='#ffd166'; ctx.fillRect((W-bw)/2,47,bw*Math.max(0,xp)/xpNext,4);
  if (weather) { ctx.fillStyle='#1c7ed6'; ctx.font='bold 12px system-ui'; ctx.textAlign='left'; ctx.fillText(t('MONSOON'),18,66); }
  ctx.fillStyle='rgba(43,29,16,.6)'; ctx.font='bold 11px system-ui'; ctx.textAlign='left'; ctx.fillText((dailyMode?'DAILY '+dailyModifier+' · ':'')+t('DAILY SEED')+' '+seedNum,18,H-12);
  if (joy.active) {
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(joy.ox,joy.oy,38,0,7); ctx.stroke();
    let kx=joy.x, ky=joy.y, dx=kx-joy.ox, dy=ky-joy.oy, d=Math.hypot(dx,dy);
    if (d>34) { kx=joy.ox+dx/d*34; ky=joy.oy+dy/d*34; }
    ctx.fillStyle='rgba(255,209,102,.75)'; ctx.beginPath(); ctx.arc(kx,ky,14,0,7); ctx.fill();
  }
  ctx.fillStyle=fpsShown<50?'#e03131':'rgba(43,29,16,.45)'; ctx.font='bold 11px system-ui'; ctx.textAlign='right'; ctx.fillText(fpsShown+' FPS',W-14,H-12);
  player.items.forEach((it,i) => {
    ctx.fillStyle=it.color; ctx.fillRect(18+i*26,H-52,22,22);
    ctx.strokeStyle='#2b1d10'; ctx.lineWidth=2; ctx.strokeRect(18+i*26,H-52,22,22);
    ctx.fillStyle='#fff'; ctx.font='bold 13px system-ui'; ctx.textAlign='center'; ctx.fillText(it.label,29+i*26,H-36);
  });
  player.evos.forEach((id,i) => {
    const evo = EVOS.find(e => e.id===id); if (!evo) return;
    ctx.fillStyle=evo.color; ctx.beginPath(); ctx.arc(29+i*22,104,8,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 9px system-ui'; ctx.textAlign='center'; ctx.fillText(evo.name[0],29+i*22,107);
  });
  for (const e of enemies) if (e.boss) { const bx=W/2-120; ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(bx,62,240,8); ctx.fillStyle=e.color; ctx.fillRect(bx,62,240*Math.max(0,e.hp)/e.maxHp,8); }
  if (eventType) { const ev=EVENTS.find(x=>x.id===eventType); ctx.fillStyle=ev.color; ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.fillText(t(ev.name)+' · '+Math.ceil(eventTime)+'s',W/2,84); }
  if (banner>0 && phase==='playing') { ctx.globalAlpha=Math.min(1,banner); ctx.fillStyle='#2b1d10'; ctx.font='bold '+Math.round(48*bannerScale())+'px system-ui'; ctx.textAlign='center'; ctx.fillText(bannerText||('WAVE '+wave),W/2,H/2-40); ctx.globalAlpha=1; }
}

let last=performance.now(), lowQ=false, fpsAcc=0, fpsFrames=0, fpsShown=60;
const STEP = 1/60;
let accumulator = 0, statsTimer = 0;
function loop(now) {
  const raw = Math.min(0.25, (now-last)/1000); last = now;
  pollPad();
  fpsAcc += raw; fpsFrames++;
  if (fpsFrames >= 30) {
    const avg = fpsAcc/fpsFrames; fpsShown = Math.round(1/Math.max(avg,0.001));
    if (avg > 0.0185) lowQ = true; else if (avg < 0.0145) lowQ = false;
    fpsAcc = 0; fpsFrames = 0;
  }
  statsTimer = (statsTimer||0) + raw;
  if (statsTimer > 0.15) { statsTimer=0; updateStatsPanel(); }
  if (phase === 'playing') {
    accumulator += raw;
    let steps = 0;
    while (accumulator >= STEP && steps < 5) { update(STEP); accumulator -= STEP; steps++; }
    if (steps === 5) accumulator = 0;
  } else accumulator = 0;
  if (player) draw(); else { ctx.drawImage(GROUND, camX, camY, W, H, camX, camY, W, H); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function showStart() {
  showOverlay('RECESS RUMBLE','Kids’ games come alive. WASD or drag to move; attacks fire themselves. Everyday India, original art, daily seed.',[
    { label:'PLAY', action:() => { dailyMode=false; dailyModifier=null; newGame(); } },
    { label:'DAILY RUN', action:startDaily },
    { label:'CHARACTER: '+(CHARACTERS.find(c=>c.id===selectedChar)||CHARACTERS[0]).name, action:showCharacters },
    { label:'LANGUAGE', action:() => { lang = lang==='en' ? 'hi' : 'en'; showStart(); } },
    { label:'SCORES', action:showScores },
    { label:'MOTION: '+(settings.reducedMotion?'LOW':'FULL'), action:() => { settings.reducedMotion=!settings.reducedMotion; showStart(); } },
    { label:'WARDROBE', action:showWardrobe }
  ],'Gully Games · v2 · 3 weapons · items + evolutions · monsoon · rotating boss · school-day events');
}
function showCharacters() {
  const btns=CHARACTERS.map(c=>{
    const it=ITEMS.find(i=>i.id===c.startItem);
    return {
      label:(c.id===selectedChar?'✓ ':'')+c.name+'\nPassive: '+c.passive+'\nWeapon: '+c.startWeapon+' T'+(c.startTier||1)+(c.secondaryWeapon?' + '+c.secondaryWeapon+' T1':'')+
        '\nItem: '+(it?it.name+' ('+it.rarity+')':c.startItem),
      action:()=>{ selectedChar=c.id; showCharacters(); }
    };
  });
  btns.push({label:'BACK',action:showStart});
  showOverlay('CHOOSE YOUR STUDENT', 'Each has a different body and starting edge.', btns, 'Brotato-style character picks.');
}
function showScores() {
  const list=getScores();
  const daily=list.filter(s=>s.daily);
  const allLines=list.map((s,i)=>(i+1)+'. '+s.score+'  ·  seed '+s.seed).join('\n');
  const dailyLines=daily.map((s,i)=>(i+1)+'. '+s.score+'  ·  '+s.daily).join('\n');
  const lines=list.length ? 'ALL TIME\n'+allLines+(daily.length?'\n\nDAILY\n'+dailyLines:'') : 'No runs recorded yet.';
  showOverlay('BEST RUNS',lines,[{label:'BACK',action:showStart}],'Top 10 on this device.');
}
function showWardrobe() {
  const btns = SKINS.map(s => ({
    label:(s.id===save.skin?'✓ ':'')+s.name+(s.ok()?'':' ('+t('LOCKED')+')'),
    action:() => { if (s.ok()) { save.skin=s.id; persist(); beep(880,0.1,0.03); } showWardrobe(); }
  }));
  btns.push({ label:'BACK', action:showStart });
  showOverlay('WARDROBE','Defeat a boss, reach level 5, or win once to unlock new looks.',btns,'Saved on this device.');
}
buildGround();
showStart();
</script>
